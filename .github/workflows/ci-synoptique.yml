name: Atlantic Alféa — contrôles des cartes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe Python et tests
        run: |
          python -m compileall -q custom_components/atlantic_alfea_controller tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Tests JavaScript
        run: |
          node --check custom_components/atlantic_alfea_controller/www/pac-synoptique-photo-card.js
          node --check custom_components/atlantic_alfea_controller/www/pac-programmes-card.js
          for test in tests/*.js; do echo "$test"; node "$test"; done
      - name: Tests navigateur simulé (jsdom)
        run: |
          npm install --no-save --no-package-lock jsdom@24.1.3
          for test in tests/dom/*.cjs; do echo "$test"; node "$test"; done
      - name: Vérifier version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("custom_components/atlantic_alfea_controller/manifest.json").read_text())
          assert isinstance(m["version"], str) and m["version"]
          PY
